<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Go Study · Tu espacio para avanzar">
  <meta property="og:description" content="Organiza las clases, las tareas y tus momentos de concentración en un solo lugar.">
  <meta name="description" content="Go Study: tus asignaturas, horario, tareas, exámenes, calendario y tiempo de estudio en un solo lugar.">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="studio.css">
  <title>Go Study · Organiza tu mundo</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="mobile-shade" id="mobile-shade" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar-top">
        <a class="brand" href="#inicio" data-action="nav" data-view="inicio" aria-label="Go Study, inicio">
          <img src="assets/logo.png" alt="Logo de Go Study" class="brand-logo">
          <span class="brand-copy"><strong>go study</strong><small>Tu espacio de estudio</small></span>
        </a>
        <span class="sidebar-label" data-i18n="navigation">NAVEGACIÓN</span>
        <nav class="nav-list" id="nav-list"></nav>
      </div>
      <div class="sidebar-bottom">
        <div class="focus-sidebar" id="sidebar-focus"></div>
        <button type="button" class="sidebar-profile" data-action="auth" id="profile-button"></button>
        <div class="sidebar-bottom-row">
          <span class="sync-status" id="sync-status"></span>
          <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Cambiar tema" title="Cambiar tema"><span data-icon="moon"></span></button>
        </div>
      </div>
    </aside>

    <div class="main-pane">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn mobile-menu-button" data-action="menu" aria-label="Abrir menú"><span data-icon="menu"></span></button>
          <div><div class="eyebrow" id="header-eyebrow">TU ESPACIO</div><h1 id="page-title">Inicio</h1><p class="page-subtitle" id="page-subtitle"></p></div>
        </div>
        <div class="topbar-search"><button type="button" class="search-trigger" data-action="command-palette" aria-label="Buscar en Go Study"><span data-icon="search"></span><span class="search-trigger-text">Buscar cualquier cosa...</span><kbd>Ctrl K</kbd></button></div>
        <div class="topbar-right">
          <span class="current-date" id="current-date"></span>
          <button type="button" class="icon-btn notifications-btn" data-action="notifications" aria-label="Notificaciones"><span data-icon="bell"></span><span id="notification-dot" class="notification-dot" hidden></span></button>
          <button type="button" class="primary-btn top-add-button" data-action="add-task"><span data-icon="plus"></span><span data-i18n="newTask">Nueva tarea</span></button>
        </div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1"></main>
      <footer class="footer">Go Study <span class="footer-dot">•</span> <span data-i18n="madeForStudents">Creado para estudiantes</span></footer>
    </div>

    <aside class="right-rail" id="right-rail" aria-label="Calendario y pendientes">
      <div class="rail-header"><div><span class="eyebrow" data-i18n="yourDay">ORGANIZA TU DÍA</span><h2 data-i18n="atGlance">De un vistazo</h2></div><div class="rail-online"><span class="rail-live-dot"></span><span class="rail-today" id="rail-clock"></span></div></div>
      <div id="rail-calendar" class="rail-widget"></div>
      <div id="rail-pending" class="rail-widget"></div>
      <div id="rail-timer" class="rail-widget"></div>
    </aside>
  </div>

  <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Navegación rápida"></nav>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-heading"><div><span class="eyebrow" id="modal-eyebrow"></span><h2 id="modal-title"></h2></div><button type="button" class="icon-btn" data-action="close-modal" aria-label="Cerrar"><span data-icon="x"></span></button></div>
      <div id="modal-body"></div>
    </section>
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
